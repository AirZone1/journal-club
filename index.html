<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Club אורתופדיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f4;--surface:#fff;--ink:#14232b;--muted:#4f5f66;--line:#d0d9d8;--accent:#0b677c;--soft:#d9eaee}
@media (prefers-color-scheme: dark){:root{--bg:#0e171b;--surface:#152228;--ink:#e4ecee;--muted:#a6b6ba;--line:#2d3e45;--accent:#5fc3d9;--soft:#16363f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:20px}
.eyebrow{color:var(--accent);font-weight:800;font-size:.85rem;letter-spacing:.04em}
h1{margin:0;font-size:2.4rem;font-weight:800;line-height:1.15}
p{margin:0;color:var(--muted)}
a.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent)}
a.card b{font-size:1.25rem}
a.card span{color:var(--muted);font-size:.95rem}
.tag{align-self:flex-start;background:var(--soft);color:var(--accent);font-weight:600;font-size:.8rem;padding:2px 10px;border-radius:999px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">JOURNAL CLUB · אורתופדיה</div>
  <h1>מצגות Journal Club</h1>
  <p>מצגות אינטראקטיביות עם מקורות מאומתים ב-PubMed.</p>
  <a class="card" href="pathologic-fractures/">
    <span class="tag">נובמבר 2026</span>
    <b>שברים פתולוגיים במחלה גרורתית לעצם</b>
    <span>Mirels, Katagiri, SINS, בורר שתל לפי מיקום, 6 מאמרי ליבה ו-10 מחקרים תומכים.</span>
  </a>
</main>
</body>
</html>
